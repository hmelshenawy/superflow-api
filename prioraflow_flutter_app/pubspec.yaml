name: prioraflow_tech
description: PrioraFlow Technician Mobile App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.8

  # Auth
  flutter_secure_storage: ^9.0.0

  # Local storage
  hive_flutter: ^1.1.0

  # Images
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.0
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.1.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code gen
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.4

  # Linting
  very_good_analysis: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env

  # Localization
  # This tells flutter gen-l10n where to find the ARB files.
  # After adding/changing ARB files, run: flutter gen-l10n